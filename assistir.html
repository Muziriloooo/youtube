<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constantinopla — assistir aos vídeos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b151b;color:#eee0bf;font:16px Arial,sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{font:32px Georgia,serif}video{display:block;width:100%;height:70vh;background:#000;border:1px solid #58615b}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,a{padding:12px 16px;border:1px solid #8a795a;border-radius:5px;background:#23333a;color:#f3dfba;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#d6b178;color:#14232a}small{color:#b6c4c6}#status{min-height:24px}
</style>
<main>
<h1 id="titulo">A queda de Constantinopla</h1>
<p><small>Documentário completo · 10 minutos · 1920 × 1080 · 30 FPS</small></p>
<video id="video" controls playsinline preload="metadata" src="exportacoes/youtube/documentario_completo.mp4"></video>
<p id="status">Aperte ▶ para assistir. Use o botão de tela cheia no player.</p>
<nav id="seletores"></nav>
<a id="download" href="exportacoes/youtube/documentario_completo.mp4" download="documentario_completo.mp4">Baixar vídeo selecionado</a>
</main>
<script>
const v=document.querySelector('#video'),status=document.querySelector('#status'),download=document.querySelector('#download');
const items=[['Documentário completo','youtube/documentario_completo.mp4'],...Array.from({length:8},(_,i)=>['Corte '+String(i+1).padStart(2,'0'),'shorts/corte_'+String(i+1).padStart(2,'0')+'.mp4'])];
for(const [index,item] of items.entries()){const b=document.createElement('button');b.textContent=item[0];b.setAttribute('aria-pressed',String(index===0));b.onclick=()=>{v.pause();v.src='exportacoes/'+item[1];v.load();download.href=v.src;download.download=item[1].split('/').pop();document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');status.textContent='Aperte ▶ para assistir ao vídeo selecionado.'};document.querySelector('#seletores').append(b)}
v.onerror=()=>status.textContent='Não foi possível carregar o arquivo. Verifique se a pasta exportacoes está ao lado desta página.';
v.onloadedmetadata=()=>status.textContent='Vídeo carregado: '+Math.round(v.duration)+' segundos. Aperte ▶ para assistir.';
</script>
</html>
